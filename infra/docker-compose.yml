# Local development infrastructure.
#
# The data stores only; the application itself runs on the host via
# `uv run uyhub <service>`. The production topology lives in
# docker-compose.prod.yml.
#
# Buckets are created by `uyhub init-storage` (see `make up`) rather than by an
# init container, so the same code path runs locally, in CI and in production.
#
# Every port is bound to 127.0.0.1 so nothing is reachable from the network.
#
# Images are pinned by digest (SPEC section 15, "dependency pinning"). The tag is
# kept alongside the digest for readability only — Docker resolves the digest. To
# upgrade, pull the new tag, read its digest with
#   docker image inspect <image>:<tag> --format '{{index .RepoDigests 0}}'
# and update both here.

name: uyhub

services:
  postgres:
    # PostgreSQL 16.15
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uyhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-uyhub}
      # Deterministic collation so ORDER BY behaves the same everywhere.
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uyhub} -d ${POSTGRES_DB:-uyhub}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    command:
      - postgres
      # Phase 4 seeds 200k listings and asserts p95 < 200 ms; give the planner
      # enough memory locally that query plans resemble production.
      - -c
      - shared_buffers=256MB
      - -c
      - work_mem=16MB
      - -c
      - max_connections=100

  redis:
    # Redis 7.4.11
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60 1000"
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # SeaweedFS all-in-one (master + volume + filer + S3 gateway) on port 8333.
  # It replaced MinIO in October 2026 when MinIO withdrew its community images
  # from every public registry; see docs/DECISIONS.md.
  #
  # The S3 identity file is written at startup from the environment rather than
  # committed, because it holds the secret key. Without a config file SeaweedFS
  # grants anonymous full access, so this is load-bearing, not convenience.
  #
  # Each bucket becomes its own SeaweedFS collection, and each collection needs a
  # volume. The default is eight 30 GB volumes, which the test suite exhausts
  # because it makes a bucket per test. Smaller volumes with no count limit
  # (auto-sized from free disk) fixes that and costs nothing in production.
  seaweedfs:
    # SeaweedFS 4.51
    image: chrislusf/seaweedfs@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-uyhub}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required — copy .env.example to .env}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-uyhub-media}
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-19000}:8333"
    volumes:
      - seaweedfs_data:/data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 077
        cat > /etc/seaweedfs/s3.json <<JSON
        {
          "identities": [
            {
              "name": "anonymous",
              "actions": ["Read:$$S3_BUCKET_MEDIA"]
            },
            {
              "name": "uyhub",
              "credentials": [
                {"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            }
          ]
        }
        JSON
        exec weed server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -ip=0.0.0.0 \
          -master.volumeSizeLimitMB=1024 -volume.max=0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
