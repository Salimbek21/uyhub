[project]
name = "uyhub"
version = "0.1.0"
description = "Telegram real-estate aggregator for Tashkent"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

# Dependencies are added in the phase that first needs them (see docs/SPEC.md
# section 17). Phase 0 ships only what the foundation itself uses.
dependencies = [
    "aioboto3>=15.5,<16",
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<0.31",
    "fastapi>=0.118,<0.200",
    "prometheus-client>=0.23,<0.24",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.11,<3",
    "redis>=6.4,<7",
    "sqlalchemy[asyncio]>=2.0.43,<2.1",
    "structlog>=25.4,<26",
    "telethon>=1.41,<2",
    "typer>=0.27,<1",
    "uvicorn[standard]>=0.38,<0.39",
]

[project.scripts]
uyhub = "uyhub.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "mypy>=1.18,<2",
    "pre-commit>=4,<5",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<0.15",
    "types-aioboto3[s3]>=15.5,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uyhub"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez — no naive datetimes (SPEC: all timestamps UTC)
    "T20",  # flake8-print — no stray print(); use structlog
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ASYNC",# flake8-async — no blocking calls in async code (CLAUDE.md)
    "S",    # flake8-bandit — security
]
ignore = [
    "S101",  # assert is fine (pytest)
    "B008",  # function call in default arg — required by Typer/FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # hardcoded test credentials are fine
"migrations/**" = ["N999", "T20"]      # revision filenames, print in templates

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option", "fastapi.Depends"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src/uyhub"]
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = ["tests.*", "migrations.*"]
ignore_errors = true

# Telethon ships no py.typed marker. Its surface is confined to
# collector/gateway.py and collector/client.py, which is the point of having
# that boundary at all.
[[tool.mypy.overrides]]
module = ["telethon.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
markers = [
    "unit: fast tests with no external dependencies",
    "integration: requires Postgres, Redis or MinIO from `make up`",
]
filterwarnings = ["error"]
